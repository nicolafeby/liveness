name: Release Flutter liveness package

on:
  push:
    tags:
      - 'liveness-v*'
      - 'liveness-edge-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to release, for example liveness-v0.1.0 or liveness-edge-v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          case "$tag" in
            liveness-edge-v*)
              package_dir='packages/liveness_edge_flutter'
              tag_version="${tag#liveness-edge-v}"
              ;;
            liveness-v*)
              package_dir='packages/liveness_verify_flutter'
              tag_version="${tag#liveness-v}"
              ;;
            *)
              echo 'Release tag must start with liveness-v or liveness-edge-v'
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate tag matches package version
        working-directory: ${{ steps.release.outputs.package_dir }}
        env:
          TAG_VERSION: ${{ steps.release.outputs.tag_version }}
        run: |
          package_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"

          if [ -z "$package_version" ]; then
            echo 'No version found in pubspec.yaml'
            exit 1
          fi

          if [ "$TAG_VERSION" != "$package_version" ]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $package_version"
            exit 1
          fi

      # Provisions the short-lived pub.dev OIDC credential. The Dart executable
      # is subsequently provided by the Flutter SDK below.
      - name: Set up pub.dev authentication
        if: github.event_name == 'push'
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: flutter test

      - name: Validate pub.dev package
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: github.event_name == 'push'
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: dart pub publish --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
