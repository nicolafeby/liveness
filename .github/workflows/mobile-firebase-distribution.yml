name: Mobile CI and Firebase App Distribution

on:
  push:
    paths:
      - 'mobile/**'
  pull_request:
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  ci:
    # Pull requests use an isolated runner; pushes use the project's Linux runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","research-liveness"]') }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Flutter with FVM on self-hosted runner
        if: github.event_name == 'push'
        env:
          FVM_EXECUTABLE: ${{ vars.FVM_EXECUTABLE }}
        run: |
          if [ -n "$FVM_EXECUTABLE" ]; then
            test -x "$FVM_EXECUTABLE" || { echo "FVM_EXECUTABLE is not executable: $FVM_EXECUTABLE"; exit 1; }
            fvm_cmd="$FVM_EXECUTABLE"
          else
            export PATH="$HOME/.pub-cache/bin:$HOME/.local/bin:$PATH"
            fvm_cmd="$(command -v fvm || true)"
            test -n "$fvm_cmd" || { echo 'FVM not found. Set repository variable FVM_EXECUTABLE to its absolute path on the runner.'; exit 1; }
          fi
          "$fvm_cmd" use 3.41.6 --skip-pub-get
          test -x .fvm/flutter_sdk/bin/flutter || { echo 'FVM did not create .fvm/flutter_sdk/bin/flutter'; exit 1; }
          echo "$PWD/.fvm/flutter_sdk/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter for pull requests
        if: github.event_name == 'pull_request'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: false

      - name: Verify Flutter version
        run: |
          flutter --version --machine | python3 -c 'import json, sys; version = json.load(sys.stdin)["frameworkVersion"]; print("Flutter", version); sys.exit(0 if version == "3.41.6" else "Expected Flutter 3.41.6")'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save APK for distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  cd:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: [self-hosted, Linux, X64, research-liveness]
    environment: research
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk

      - name: Check distribution configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Set FIREBASE_SERVICE_ACCOUNT in the research environment'; exit 1; }
          test -n "$FIREBASE_TESTER_GROUPS" || { echo 'Set FIREBASE_TESTER_GROUPS in the research environment'; exit 1; }

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute APK to testers
        env:
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          app_id="$(python3 -c 'import json; print(json.load(open("android/app/google-services.json"))["client"][0]["client_info"]["mobilesdk_app_id"])')"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$app_id" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "GitHub commit ${GITHUB_SHA}"
