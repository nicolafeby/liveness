name: Mobile CI and Firebase App Distribution

on:
  push:
    paths:
      - 'mobile/**'
  pull_request:
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  android:
    # Pull requests use an isolated runner; pushes use the project's Linux runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","research-liveness"]') }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find preinstalled Flutter on self-hosted runner
        id: flutter-sdk
        if: github.event_name == 'push'
        env:
          FLUTTER_SDK_PATH: ${{ vars.FLUTTER_SDK_PATH }}
        run: |
          if [ -n "$FLUTTER_SDK_PATH" ]; then
            test -x "$FLUTTER_SDK_PATH/bin/flutter" || { echo "No executable bin/flutter in FLUTTER_SDK_PATH: $FLUTTER_SDK_PATH"; exit 1; }
            candidate="$FLUTTER_SDK_PATH/bin/flutter"
          else
            candidate="$(command -v flutter || true)"
          fi
          if [ -n "$candidate" ]; then
            version="$("$candidate" --version --machine | python3 -c 'import json, sys; print(json.load(sys.stdin)["frameworkVersion"])')"
            if [ "$version" = '3.41.6' ]; then
              echo "$(dirname "$candidate")" >> "$GITHUB_PATH"
              echo 'found=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Found Flutter $version; preparing Flutter 3.41.6"
          fi
          echo 'found=false' >> "$GITHUB_OUTPUT"

      - name: Set up Flutter 3.41.6 when absent
        if: github.event_name == 'pull_request' || steps.flutter-sdk.outputs.found != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: false

      - name: Verify Flutter version
        run: |
          flutter --version --machine | python3 -c 'import json, sys; version = json.load(sys.stdin)["frameworkVersion"]; print("Flutter", version); sys.exit(0 if version == "3.41.6" else "Expected Flutter 3.41.6; set repository variable FLUTTER_SDK_PATH to the installed SDK directory")'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Check distribution configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Set the FIREBASE_SERVICE_ACCOUNT repository secret'; exit 1; }
          test -n "$FIREBASE_TESTER_GROUPS" || { echo 'Set the FIREBASE_TESTER_GROUPS repository variable'; exit 1; }

      - name: Authenticate to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global firebase-tools

      - name: Distribute APK to testers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          app_id="$(python3 -c 'import json; print(json.load(open("android/app/google-services.json"))["client"][0]["client_info"]["mobilesdk_app_id"])')"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$app_id" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "GitHub commit ${GITHUB_SHA}"
