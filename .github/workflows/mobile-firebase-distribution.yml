name: Mobile CI and Firebase App Distribution

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'packages/liveness_flutter/**'
permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, Linux, X64, liveness]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Flutter with FVM on self-hosted runner
        env:
          FVM_EXECUTABLE: ${{ vars.FVM_EXECUTABLE }}
        run: |
          if [ -n "$FVM_EXECUTABLE" ]; then
            test -x "$FVM_EXECUTABLE" || { echo "FVM_EXECUTABLE is not executable: $FVM_EXECUTABLE"; exit 1; }
            fvm_cmd="$FVM_EXECUTABLE"
          else
            export PATH="$HOME/.pub-cache/bin:$HOME/.local/bin:$PATH"
            fvm_cmd="$(command -v fvm || true)"
            if [ -z "$fvm_cmd" ] && [ -x /home/ncladr/fvm/bin/fvm ]; then
              fvm_cmd=/home/ncladr/fvm/bin/fvm
            fi
            test -n "$fvm_cmd" || { echo 'FVM not found. Set repository variable FVM_EXECUTABLE to its absolute path on the runner.'; exit 1; }
          fi
          "$fvm_cmd" use 3.41.6 --skip-pub-get
          test -x .fvm/flutter_sdk/bin/flutter || { echo 'FVM did not create .fvm/flutter_sdk/bin/flutter'; exit 1; }
          echo "$PWD/.fvm/flutter_sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter version
        run: |
          flutter --version --machine | python3 -c 'import json, sys; version = json.load(sys.stdin)["frameworkVersion"]; print("Flutter", version); sys.exit(0 if version == "3.41.6" else "Expected Flutter 3.41.6")'

      - name: Install dependencies
        run: flutter pub get

      # - name: Analyze Dart code
      #   run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  cd:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: ci
    runs-on: [self-hosted, Linux, X64, liveness]
    environment: research
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Flutter with FVM
        env:
          FVM_EXECUTABLE: ${{ vars.FVM_EXECUTABLE }}
        run: |
          if [ -n "$FVM_EXECUTABLE" ]; then
            test -x "$FVM_EXECUTABLE" || { echo "FVM_EXECUTABLE is not executable: $FVM_EXECUTABLE"; exit 1; }
            fvm_cmd="$FVM_EXECUTABLE"
          else
            export PATH="$HOME/.pub-cache/bin:$HOME/.local/bin:$PATH"
            fvm_cmd="$(command -v fvm || true)"
            if [ -z "$fvm_cmd" ] && [ -x /home/ncladr/fvm/bin/fvm ]; then
              fvm_cmd=/home/ncladr/fvm/bin/fvm
            fi
            test -n "$fvm_cmd" || { echo 'FVM not found. Set repository variable FVM_EXECUTABLE to its absolute path on the runner.'; exit 1; }
          fi
          "$fvm_cmd" use 3.41.6 --skip-pub-get
          test -x .fvm/flutter_sdk/bin/flutter || { echo 'FVM did not create .fvm/flutter_sdk/bin/flutter'; exit 1; }
          echo "$PWD/.fvm/flutter_sdk/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          LIVENESS_API_URL: ${{ vars.LIVENESS_API_URL }}
        run: |
          test -n "$LIVENESS_API_URL" || { echo 'Set LIVENESS_API_URL in the research environment'; exit 1; }
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="LIVENESS_API_URL=$LIVENESS_API_URL"

      - name: Save APK for distribution
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Check distribution configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Set FIREBASE_SERVICE_ACCOUNT in the research environment'; exit 1; }
          test -n "$FIREBASE_TESTER_GROUPS" || { echo 'Set FIREBASE_TESTER_GROUPS in the research environment'; exit 1; }

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Firebase CLI
        run: |
          current_version="$(firebase --version 2>/dev/null || true)"
          if [ "$current_version" = '15.30.1' ]; then
            echo "Firebase CLI $current_version is already installed; skipping installation"
          else
            echo "Installing Firebase CLI 15.30.1 (current: ${current_version:-not installed})"
            npm install --global firebase-tools@15.30.1
          fi

      - name: Verify Firebase CLI
        run: |
          version="$(firebase --version)"
          echo "Firebase CLI $version"
          test "$version" = '15.30.1' || { echo 'Expected Firebase CLI 15.30.1'; exit 1; }

      - name: Distribute APK to testers
        env:
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          app_id="$(python3 -c 'import json; print(json.load(open("android/app/google-services.json"))["client"][0]["client_info"]["mobilesdk_app_id"])')"
          release_notes="$(git log -5 --pretty=format:'- %s')"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$app_id" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$release_notes"
