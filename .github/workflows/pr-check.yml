name: PR check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      liveness_verify_flutter: ${{ steps.filter.outputs.liveness_verify_flutter }}
      liveness_edge_flutter: ${{ steps.filter.outputs.liveness_edge_flutter }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed stacks
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/pr-check.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/pr-check.yml'
            liveness_verify_flutter:
              - 'packages/liveness_verify_flutter/**'
              - '.github/workflows/pr-check.yml'
            liveness_edge_flutter:
              - 'packages/liveness_edge_flutter/**'
              - '.github/workflows/pr-check.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test
        working-directory: backend
        run: python -m unittest discover -s . -p 'test_*.py' -v

  liveness_verify_flutter:
    name: Liveness Verify package
    needs: changes
    if: needs.changes.outputs.liveness_verify_flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: packages/liveness_verify_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: packages/liveness_verify_flutter
        run: flutter analyze
      - name: Test
        working-directory: packages/liveness_verify_flutter
        run: flutter test

  liveness_edge_flutter:
    name: Liveness Edge package
    needs: changes
    if: needs.changes.outputs.liveness_edge_flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: packages/liveness_edge_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: packages/liveness_edge_flutter
        run: flutter analyze
      - name: Test
        working-directory: packages/liveness_edge_flutter
        run: flutter test

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test

  check:
    name: Check
    needs:
      - changes
      - backend
      - liveness_verify_flutter
      - liveness_edge_flutter
      - mobile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LIVENESS_VERIFY_RESULT: ${{ needs.liveness_verify_flutter.result }}
          LIVENESS_EDGE_RESULT: ${{ needs.liveness_edge_flutter.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          for result in "$CHANGES_RESULT" "$BACKEND_RESULT" "$LIVENESS_VERIFY_RESULT" "$LIVENESS_EDGE_RESULT" "$MOBILE_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
