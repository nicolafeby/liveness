name: Liveness package PR check

on:
  pull_request:
    paths:
      - 'packages/liveness_flutter/**'
      - '.github/workflows/liveness-package-pr-check.yml'

permissions:
  contents: read

concurrency:
  group: liveness-package-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/liveness_flutter

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
